# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Perlica (佩丽卡) desktop pet: host half registers /api/dsh-pet-perlica/*
# routes and projects session activity; the dsh.client half is discovered
# from this entry and served to the browser automatically.
- insert:
    - id: pet-perlica
      name: 'dsh-pet-perlica'

# dsh-doc: fully local PDF/Office/OCR. runtimeDir is resolved at mount time
# from DSH_HOME (set by start-dsh.ps1 / dsh.cmd), so the whole portable
# folder can be moved to another path or machine without editing this file.
- id: dsh-doc
  config:
    engine: python
    runtimeDir: !!js "process.env.DSH_HOME + '/runtimes/dshdoc-runtime-win32-x64'"
    maxFileBytes: 52428800
    maxOutputChars: 32000
    defaultOcr: true
    defaultTableMode: accurate
    defaultOutputFormat: md

